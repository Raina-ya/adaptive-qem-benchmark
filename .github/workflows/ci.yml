env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-ci.txt
      - name: Lint project sources
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest
      - name: Regenerate and verify deterministic artifacts
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: .matplotlib-cache
        run: python -m src.verify_generated_artifacts --run-log-output results/runs
      - name: Upload generation run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-run-logs
          path: results/runs/
          retention-days: 30
